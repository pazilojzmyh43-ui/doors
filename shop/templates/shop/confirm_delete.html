{% extends "shop/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="page narrow-page">
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn--danger" type="submit">Удалить</button>
        <a class="btn btn--ghost" href="{% url cancel_url %}">Отмена</a>
    </form>
</section>
{% endblock %}
