<article class="card">
    <a class="card__media" href="{% url 'product_detail' product.id %}">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
        <span class="ph"></span>
        {% endif %}
        {% if not product.in_stock %}<em>Под заказ</em>{% endif %}
    </a>
    <div class="card__body">
        <p class="eyebrow">{{ product.category.name }}</p>
        <h3><a href="{% url 'product_detail' product.id %}">{{ product.name }}</a></h3>
        <p class="price">{{ product.price_label }} ₽</p>
        {% if user_role == 'client' or not user.is_authenticated %}
        <form method="post" action="{% url 'cart_add' product.id %}">
            {% csrf_token %}
            <button class="btn btn--small" type="submit">В корзину</button>
        </form>
        {% else %}
        <a class="btn btn--small btn--ghost" href="{% url 'product_detail' product.id %}">Подробнее</a>
        {% endif %}
    </div>
</article>
